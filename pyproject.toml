[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pan26-ai-detector"
version = "1.0.0"
description = "PAN 2026 Voight-Kampff Generative AI Detection System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "transformers>=4.49.0",
    "torch>=2.1.0",
    "accelerate>=1.4.0",
    "datasets>=2.0.0",
    "tqdm>=4.65.0",
    "nltk>=3.8.0",
    "sentence-transformers>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]